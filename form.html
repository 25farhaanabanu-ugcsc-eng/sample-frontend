<!DOCTYPE html><html>
<head>
    <title>Student Registration Form</title>
</head>
<body><h2>Student Registration Form</h2><form>
    Name:
    <input type="text" name="name"><br><br>Email:
<input type="email" name="email"><br><br>

Phone Number:
<input type="tel" name="phone"><br><br>

    <option>BCA</option>
    <option>B.Com</option>
    <option>B.Sc Maths</option>
</select><br><br>

<input type="reset" value="Clear">

</form></body>
</html>
